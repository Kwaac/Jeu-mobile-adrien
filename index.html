<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="RPG Mobile Premium - Brave Frontier Style">
    <meta name="theme-color" content="#667eea">
    <title>Brave RPG - Mobile Game</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inventory-rpg.css">
    <link rel="stylesheet" href="css/evolution.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <!-- UI Elements will be injected here -->
            <div id="debug-overlay"
                style="color: white; font-family: monospace; padding: 10px; background: rgba(0,0,0,0.8);">
                Initializing...</div>
        </div>
    </div>
    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            const overlay = document.getElementById('debug-overlay');
            if (overlay) {
                overlay.innerHTML += `<br><span style="color:red">Error: ${message} at ${source}:${lineno}:${colno}</span>`;
                console.error(error);
            }
        };
        window.addEventListener('unhandledrejection', function (event) {
            const overlay = document.getElementById('debug-overlay');
            if (overlay) {
                overlay.innerHTML += `<br><span style="color:orange">Promise Rejection: ${event.reason}</span>`;
            }
        });
    </script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
